<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>م. عبدالرحمن أبو عيشة | Full-Stack Software Engineer</title>
    <meta
      data-seo
      name="description"
      content="Full-Stack Software Engineer specialising in PHP 8.3, Laravel, React and clean, scalable REST APIs."
    />
    <!--
      Pre-paint bootstrap (kept tiny and dependency-free).
      Resolves theme and locale BEFORE the first paint so there is no flash of
      the wrong theme or a left-to-right layout on Arabic pages.
      Also decides whether the boot intro plays: first home-page view of the
      session only. It sets data-boot="play", which shows a CSS cover until
      React takes over (the content underneath is fully rendered, and without
      JavaScript nothing is covered).
      Mirrors: src/context/ThemeContext.jsx, src/main.jsx, src/features/intro.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme, locale;
        try {
          theme = localStorage.getItem('portfolio.theme');
          locale = localStorage.getItem('portfolio.locale');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        root.setAttribute('data-theme', theme);
        var isEn = /^\/en(\/|$)/.test(location.pathname) || locale === 'en';
        root.lang = isEn ? 'en' : 'ar';
        root.dir = isEn ? 'ltr' : 'rtl';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f1ea' : '#07080b');
        var booted = null;
        try {
          booted = sessionStorage.getItem('portfolio.boot');
        } catch (e) {}
        if (booted !== '1' && /^\/(en\/?)?$/.test(location.pathname)) {
          root.setAttribute('data-boot', 'play');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio requires JavaScript. · يتطلب هذا الموقع تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
